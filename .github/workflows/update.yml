name: Cap nhat 7 danh muc KKPhim
on:
  schedule:
    - cron: '0 * * * *' # Tự động chạy mỗi 1 tiếng
  workflow_dispatch:     # Cho phép bấm chạy thủ công ngay lập tức

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.js
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cap nhat phim moi" && git push)
